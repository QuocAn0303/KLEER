services:
  # ============================================
  # Nginx - Reverse Proxy
  # ============================================
  nginx:
    image: nginx:1.25-alpine
    container_name: kleer-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./:/var/www/html:cached
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads.conf:/etc/nginx/conf.d/uploads.conf:ro
    depends_on:
      php:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    networks:
      - kleer-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================
  # PHP 8.2 FPM - WordPress Backend
  # ============================================
  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: kleer-php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:cached
    environment:
      WORDPRESS_DB_HOST: "${WORDPRESS_DB_HOST}"
      WORDPRESS_DB_NAME: "${WORDPRESS_DB_NAME}"
      WORDPRESS_DB_USER: "${WORDPRESS_DB_USER}"
      WORDPRESS_DB_PASSWORD: "${WORDPRESS_DB_PASSWORD}"
      WORDPRESS_TABLE_PREFIX: "${WORDPRESS_TABLE_PREFIX:-wp_}"
      WORDPRESS_DEBUG: "${WORDPRESS_DEBUG:-false}"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', ${WORDPRESS_DEBUG:-false});
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', false);
        define('FS_METHOD', 'direct');
        define('UPLOADS', 'wp-content/uploads');
        define('WP_HOME', '${WP_HOME:-http://localhost:80}');
        define('WP_SITEURL', '${WP_SITEURL:-http://localhost:80}');
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kleer-net
    healthcheck:
      test: ["CMD", "php-fpm8.2", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================
  # MariaDB 10.11 - Database
  # ============================================
  mariadb:
    image: mariadb:10.11
    container_name: kleer-mariadb
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-kleer_db}"
      MYSQL_USER: "${MYSQL_USER:-kleer_user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_HOST: "${MYSQL_ROOT_HOST:-%}"
    volumes:
      - kleer-mariadb-data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-file-format=Barracuda
      --innodb-large-prefix=1
      --innodb-default-row-format=DYNAMIC
      --skip-name-resolve
    networks:
      - kleer-net
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================
  # Redis - Object Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: kleer-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - kleer-redis-data:/data
    networks:
      - kleer-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================
  # phpMyAdmin - Database Management UI
  # ============================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: kleer-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 100M
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - kleer-net
    healthcheck:
      test: ["CMD", "php", "-r", "file_get_contents('http://localhost:80/')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  kleer-net:
    driver: bridge

volumes:
  kleer-mariadb-data:
    driver: local
  kleer-redis-data:
    driver: local
