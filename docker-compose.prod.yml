# ============================================
# Production overrides - HTTPS + Let's Encrypt
# ============================================
#
# Dung nhu sau (xem deploy/deploy.sh):
#   docker compose --env-file .env.production -f docker-compose.yml \
#                  -f docker-compose.prod.yml up -d
#
# File nay KHONG duoc dung o local: may chay thi chung thu SSL chua co,
# nginx se khong khoi dong duoc.

services:
  nginx:
    # Ban HTTPS thay cho ban HTTP o nginx.conf.
    volumes:
      - ./:/var/www/html:cached
      - ./deploy/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads.conf:/etc/nginx/conf.d/uploads.conf:ro
      # Certbot dua chung thu vao day.
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped

  # ============================================
  # Certbot - cap nhat chung thu Let's Encrypt
  # ============================================
  certbot:
    image: certbot/certbot:latest
    container_name: kleer-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # renew phai chay lien tuc. Deploy lai khong can chay thu cong.
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  letsencrypt:
    driver: local
  certbot_www:
    driver: local
