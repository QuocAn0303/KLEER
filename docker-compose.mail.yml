# Hop thu thu nghiem cho moi truong dev (Mailpit). Khong dung production.
#   docker compose -f docker-compose.yml -f docker-compose.mail.yml up -d mailpit
# SMTP trong Docker: mailpit:1025 (khong xac thuc). Giao dien xem thu: http://localhost:8025
services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: kleer-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    networks:
      - kleer-net
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 3

